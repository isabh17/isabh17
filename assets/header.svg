    <g><rect x="1048" y="62" width="96" height="48" rx="7" fill="#fff" opacity=".92"/>
      <text x="1058" y="79">cuenta</text><text x="1058" y="97" opacity=".6">saldo</text></g>
    <g><rect x="1048" y="176" width="96" height="48" rx="7" fill="#fff" opacity=".92"/>
      <text x="1058" y="193">auditoría</text><text x="1058" y="211" opacity=".6">trigger</text></g>
    <g><rect x="796" y="62" width="92" height="48" rx="7" fill="#fff" opacity=".92"/>
      <text x="806" y="79">tx</text><text x="806" y="97" opacity=".6">monto</text></g>
    <g><rect x="796" y="176" width="92" height="48" rx="7" fill="#fff" opacity=".92"/>
      <text x="806" y="193">depósito</text><text x="806" y="211" opacity=".6">fecha</text></g>
  </g>


