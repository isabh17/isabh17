<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Isabel Masaya">
<defs>
  <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFF1F7"/><stop offset="55%" stop-color="#FBC4DC"/><stop offset="100%" stop-color="#E76A9C"/>
  </linearGradient>
  <g id="flor">
