      <ellipse cx="0" cy="-7" rx="4.4" ry="6.6"/>
      <ellipse cx="6.7" cy="-2.2" rx="4.4" ry="6.6" transform="rotate(72)"/>
      <ellipse cx="4.1" cy="5.7" rx="4.4" ry="6.6" transform="rotate(144)"/>
      <ellipse cx="-4.1" cy="5.7" rx="4.4" ry="6.6" transform="rotate(216)"/>
      <ellipse cx="-6.7" cy="-2.2" rx="4.4" ry="6.6" transform="rotate(288)"/>
    </g>
    <circle r="3.1" fill="#FFF6D6"/>
  </g>
  <clipPath id="rA"><rect width="1200" height="280" rx="26"/></clipPath>
</defs>
<g clip-path="url(#rA)">
  <rect width="1200" height="280" fill="#FFF1F7"/>
  <rect width="1200" height="280" fill="url(#bgA)" opacity=".9"/>

  <g stroke="#C9426F" stroke-width="2" opacity=".45" fill="none">
