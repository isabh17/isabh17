    <circle r="5" opacity=".9"><animateMotion dur="3.1s" repeatCount="indefinite" path="M890 86 H1050"/></circle>
    <circle r="5" opacity=".9"><animateMotion dur="4.9s" repeatCount="indefinite" path="M890 200 H990 V150 H1050"/></circle>
  </g>

