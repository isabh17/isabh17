<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="presentation">
<defs>
  <linearGradient id="bgF" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#E76A9C"/><stop offset="55%" stop-color="#FBC4DC"/><stop offset="100%" stop-color="#FFF1F7"/>
  </linearGradient>
  <g id="florF">
    <g fill="currentColor">
      <ellipse cx="0" cy="-7" rx="4.4" ry="6.6"/>
      <ellipse cx="6.7" cy="-2.2" rx="4.4" ry="6.6" transform="rotate(72)"/>
      <ellipse cx="4.1" cy="5.7" rx="4.4" ry="6.6" transform="rotate(144)"/>
      <ellipse cx="-4.1" cy="5.7" rx="4.4" ry="6.6" transform="rotate(216)"/>
      <ellipse cx="-6.7" cy="-2.2" rx="4.4" ry="6.6" transform="rotate(288)"/>
    </g>
    <circle r="3.1" fill="#FFF6D6"/>
  </g>
  <clipPath id="rF"><rect width="1200" height="120" rx="26"/></clipPath>
</defs>
<g clip-path="url(#rF)">
  <rect width="1200" height="120" fill="url(#bgF)"/>

  <g fill="#fff" opacity=".16">
    <circle cx="180" cy="14" r="62"><animate attributeName="cy" values="14;26;14" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="106" r="54"><animate attributeName="cy" values="106;94;106" dur="9.5s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <g transform="translate(330,34)" color="#fff" opacity=".8"><use href="#florF" transform="scale(.8)"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="24s" repeatCount="indefinite" additive="sum"/></g>
    <g transform="translate(872,84)" color="#E76A9C" opacity=".7"><use href="#florF" transform="scale(.72)"/>
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="29s" repeatCount="indefinite" additive="sum"/></g>
    <g transform="translate(626,26)" color="#fff" opacity=".65"><use href="#florF" transform="scale(.6)"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite" additive="sum"/></g>
  </g>

  <text x="600" y="66" text-anchor="middle" fill="#fff" font-family="Trebuchet MS,Verdana,sans-serif" font-size="17" letter-spacing="2.6" opacity=".95">thanks for stopping by</text>
  <text x="600" y="90" text-anchor="middle" fill="#fff" font-family="Menlo,Consolas,monospace" font-size="12" letter-spacing="1.2" opacity=".78">silverisa17@gmail.com</text>
</g>
</svg>
